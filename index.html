<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.banner{background:#fff3d8;color:#76510b;text-align:center;padding:8px 14px;font-size:11px;font-weight:850;letter-spacing:.06em;position:sticky;top:0;z-index:30;border-bottom:1px solid #efdcae}.shell{display:flex;min-height:calc(100vh - 36px)}aside{width:252px;background:var(--navy);color:#dce8f1;padding:20px 14px;display:flex;flex-direction:column;flex-shrink:0}.brand{padding:5px 12px 21px;border-bottom:1px solid #ffffff25}.brand-mark{width:36px;height:36px;border-radius:10px;background:#21877f;display:grid;place-items:center;color:white;font-weight:900;font-size:17px;margin-bottom:11px}.brand strong{display:block;color:#fff;font-size:14px;line-height:1.35}.brand small{color:#a9bfd0;font-size:11px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#91abc0;padding:20px 12px 6px}.nav button{width:100%;border:0;background:transparent;color:#d4e0e9;text-align:left;padding:9px 12px;border-radius:8px;margin:2px 0;display:flex;gap:10px;align-items:center;font-size:12px}.nav button:hover,.nav button.active{background:#ffffff19;color:#fff}.ico{width:18px;text-align:center;font-size:15px}.side-note{margin-top:auto;padding:14px 12px 0;border-top:1px solid #ffffff25;color:#a9bfd0;font-size:10px}.side-note b{display:block;color:white;font-size:12px;margin-bottom:4px}main{min-width:0;flex:1}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.crumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.role{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:white;color:var(--ink);font-size:11px;max-width:240px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#e3f1ef;color:#176e68;font-weight:850}.content{max-width:1420px;margin:auto;padding:27px 30px 48px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:19px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--teal);font-weight:850}.page-head h1{font-size:25px;line-height:1.2;color:var(--navy);margin:5px 0 7px;letter-spacing:-.03em}.page-head p{margin:0;color:var(--muted);max-width:800px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:8px;font-size:11px;font-weight:750}.btn:hover{border-color:#9db4c6}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.teal{background:var(--teal);color:white;border-color:var(--teal)}.btn.danger{color:var(--red)}.grid{display:grid;gap:14px}.two{grid-template-columns:1.2fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{color:var(--navy);margin:0}.card h3{font-size:14px}.card p{color:var(--muted);font-size:12px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}.card-head p{margin:4px 0 0}.notice{padding:12px 14px;border:1px solid #d8e7ed;background:#eef6f8;color:#36586b;border-radius:9px;font-size:12px;margin-bottom:15px}.notice.warn{background:#fff8e9;border-color:#efdfbb;color:#785a23}.notice.good{background:#edf7f3;border-color:#d1e9df;color:#286b5d}.notice.red{background:#fbefef;border-color:#efd6d7;color:#88474b}.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:16px 0}.flow-step{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff;min-height:116px}.flow-step .n{width:24px;height:24px;border-radius:7px;background:#eaf3f5;color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:850;margin-bottom:8px}.flow-step b{display:block;color:var(--navy);font-size:12px}.flow-step small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.list{display:grid;gap:9px}.list-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border:0}.list-icon{width:28px;height:28px;border-radius:8px;background:#eef4f7;display:grid;place-items:center;color:var(--blue);flex-shrink:0}.list-row b{display:block;color:var(--navy);font-size:12px}.list-row small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.tag{display:inline-flex;padding:4px 8px;border-radius:6px;background:#f0f4f6;color:#536a7c;font-size:10px;font-weight:700}.status{display:inline-flex;padding:4px 8px;border-radius:99px;background:#edf5f2;color:#287660;font-size:10px;font-weight:800;white-space:nowrap}.status.warn{background:#fff4df;color:#92620f}.status.bad{background:#faeaea;color:#a3484e}.status.gray{background:#eef1f4;color:#617184}.filters{display:flex;flex-wrap:wrap;align-items:end;gap:10px;background:#fff;border:1px solid var(--line);padding:13px;border-radius:10px;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:4px;min-width:140px;flex:1}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;background:white;color:var(--ink);font-size:12px}.field textarea{min-height:76px;resize:vertical}.field small{font-size:10px;color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:white}table{width:100%;border-collapse:collapse;min-width:600px}th{text-align:left;background:#f7f9fa;color:var(--muted);font-size:10px;text-transform:uppercase;padding:10px 12px}td{padding:11px 12px;border-top:1px solid var(--line);font-size:11px}td b{color:var(--navy)}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.cards{display:grid;gap:11px}.item{background:white;border:1px solid var(--line);border-radius:10px;padding:14px}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{margin:0;color:var(--navy);font-size:13px}.item p{margin:6px 0;color:var(--muted);font-size:11px}.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.modal-bg{position:fixed;inset:0;background:#0d2236aa;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}.modal-bg.show{display:flex}.modal{background:white;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:21px;box-shadow:0 20px 60px #0003}.modal h2{font-size:18px;color:var(--navy);margin:0 0 15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:18px;bottom:18px;background:#173c59;color:white;padding:11px 15px;border-radius:9px;z-index:90;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;font-size:12px}.toast.show{opacity:1;transform:translateY(0)}.mobile{display:none}.footer{margin-top:20px;text-align:center;color:#81909d;font-size:10px}.timeline{border-left:2px solid #dce8ee;padding-left:16px;margin-left:6px;display:grid;gap:13px}.timeline b{display:block;color:var(--navy);font-size:12px}.timeline small{color:var(--muted);font-size:10px}.timeline div{position:relative}.timeline div:before{content:"";position:absolute;left:-21px;top:5px;width:8px;height:8px;background:var(--teal);border-radius:50%}.checkline{display:flex;gap:9px;align-items:flex-start;padding:8px 0;font-size:12px}.checkline input{margin-top:3px}.divider{height:1px;background:var(--line);margin:13px 0}
@media(max-width:1050px){.four{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:740px){aside{position:fixed;z-index:50;left:-265px;top:36px;bottom:0;transition:.2s}aside.open{left:0}.topbar{height:58px;padding:0 13px}.content{padding:19px 13px 35px}.page-head{flex-direction:column}.page-head h1{font-size:22px}.mobile{display:inline-flex}.role{max-width:150px}.three,.four{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:430px){.three,.four,.flow{grid-template-columns:1fr}.top-actions{gap:5px}.role{max-width:125px;font-size:10px}}

<div class="shell">
<aside id="sidebar">
 <div class="brand"><div class="brand-mark">F</div><strong>Gestão Estratégica<br>do Absenteísmo</strong><small>FGH · Apoio à gestão de ações</small></div>
 <div class="nav-label">Ciclo de gestão</div>
 <nav class="nav" id="nav">

 <div class="side-note"><b>Fundação Gestão Hospitalar</b>Protótipo de fluxo institucional<br>Versão demonstrativa · 2026</div>

<main>
 <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn mobile" id="menuBtn">☰</button><span class="crumb">FGH / <b id="crumb">Início</b></span></div><div class="top-actions"><select class="role" id="roleSelect" aria-label="Perfil demonstrativo"><option value="admin">Perfil: Administração FGH</option><option value="institucional">Gestão institucional</option><option value="rh">RH institucional</option><option value="hospital">Gestão hospitalar</option><option value="setor">Gestão setorial</option><option value="consulta">Consulta</option></select><div class="avatar">FG</div></div></header>

<script>
(function(){
const KEY='fgh_absenteismo_gestao_v2';
let diagnoses=read('diagnoses',[]),plans=read('plans',[]),lessons=read('lessons',[]),page='inicio',role='admin';
function read(k,def){try{const x=JSON.parse(localStorage.getItem(KEY+'_'+k)||'null');return Array.isArray(x)?x:def}catch(e){return def}}
function persist(){localStorage.setItem(KEY+'_diagnoses',JSON.stringify(diagnoses));localStorage.setItem(KEY+'_plans',JSON.stringify(plans));localStorage.setItem(KEY+'_lessons',JSON.stringify(lessons))}
function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateBR(s){if(!s)return '—';let a=s.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:s}
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function go(p){page=p;render();$('sidebar').classList.remove('open');window.scrollTo(0,0)}
function head(k,t,d,action){return '<div class="page-head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></div>'+(action||'')+'</div>'}
function note(t,kind){return '<div class="notice '+(kind||'')+'">'+t+'</div>'}
function status(s){let c=s==='Concluído'||s==='Efetiva'?'':s==='Em andamento'||s==='Parcial'?'warn':s==='Atrasado'||s==='Não efetiva'?'bad':'gray';return '<span class="status '+c+'">'+esc(s)+'</span>'}
function empty(t,sub){return '<div class="card empty"><b>'+t+'</b><br>'+sub+'</div>'}
function foot(){return '<div class="footer">Protótipo demonstrativo · Sem conexão com BI/RH · Registros armazenados somente neste navegador.</div>'}
function home(){
let due=plans.filter(p=>p.status!=='Concluído'&&p.due&&p.due<today()).length;
return head('GESTÃO ESTRATÉGICA · FGH','Da informação à ação','O BI já acompanha os indicadores de absenteísmo. Esta ferramenta organiza o que acontece depois: análise do contexto, pactuação de respostas, execução, avaliação e aprendizado.','<button class="btn primary" data-go="diagnostico">Iniciar diagnóstico</button>')+
note('<b>Divisão de funções:</b> o BI permanece como fonte oficial dos indicadores, taxas, horas, custos e comparações. Aqui não se reproduzem esses números nem se solicita que gestores os lancem novamente. A ferramenta registra o raciocínio, as decisões e as ações institucionais.','good')+
'<div class="flow"><div class="flow-step"><div class="n">1</div><b>Consultar o BI</b><small>Identificar um sinal ou situação que merece atenção. A consulta ocorre no BI existente.</small></div><div class="flow-step"><div class="n">2</div><b>Compreender</b><small>Realizar diagnóstico curto, separar fatos, hipóteses e lacunas.</small></div><div class="flow-step"><div class="n">3</div><b>Planejar</b><small>Definir ações, responsáveis, prazos e apoios necessários.</small></div><div class="flow-step"><div class="n">4</div><b>Acompanhar</b><small>Registrar execução, obstáculos, evidências e ajustes.</small></div><div class="flow-step"><div class="n">5</div><b>Avaliar e aprender</b><small>Verificar efetividade consultando novamente o BI e registrar aprendizados.</small></div></div>'+
'<div class="grid two"><div class="card"><div class="card-head"><div><h3>O que esta ferramenta deve ajudar a responder?</h3><p>Foco na gestão das respostas, não na repetição dos indicadores.</p></div></div><div class="list"><div class="list-row"><div class="list-icon">⌕</div><div><b>O que está acontecendo no contexto de trabalho?</b><small>Qual situação foi sinalizada no BI? O que já sabemos e o que ainda precisa ser investigado?</small></div></div><div class="list-row"><div class="list-icon">◎</div><div><b>O que pode ser feito para enfrentar os fatores identificados?</b><small>Quais mudanças organizacionais, preventivas ou de apoio são viáveis?</small></div></div><div class="list-row"><div class="list-icon">☷</div><div><b>Quem fará o quê e em qual prazo?</b><small>Transformar intenção em ação pactuada, com responsabilidade e suporte definidos.</small></div></div><div class="list-row"><div class="list-icon">✓</div><div><b>O que mudou depois da intervenção?</b><small>Verificar execução e consultar o BI novamente, sem duplicar os números aqui.</small></div></div></div></div><div class="card"><div class="card-head"><div><h3>Seu espaço de trabalho</h3><p>Os registros aparecem aqui após serem criados.</p></div></div><div class="list"><div class="list-row"><div class="list-icon">⌕</div><div><b>Diagnósticos registrados</b><small>'+diagnoses.length+' registro(s) neste navegador</small></div></div><div class="list-row"><div class="list-icon">☷</div><div><b>Planos de ação</b><small>'+plans.length+' plano(s) cadastrado(s)</small></div></div><div class="list-row"><div class="list-icon">◷</div><div><b>Planos com prazo vencido</b><small>'+due+' pendência(s) a verificar</small></div></div><div class="list-row"><div class="list-icon">✦</div><div><b>Boas práticas registradas</b><small>'+lessons.length+' registro(s) de aprendizado ou reconhecimento</small></div></div></div><div class="divider"></div><button class="btn teal" data-go="planos">Acessar planos de ação</button></div></div>'+
'<div class="card" style="margin-top:14px"><div class="card-head"><div><h3>Princípios de uso</h3><p>Orientação institucional para todas as etapas.</p></div></div><div class="grid three"><div><span class="tag">Não punitivo</span><p>Investigar condições, processos e organização do trabalho. Não atribuir culpa individual.</p></div><div><span class="tag">Sem dados pessoais</span><p>Não registrar nomes, matrículas, diagnósticos médicos ou informações identificáveis de trabalhadores.</p></div><div><span class="tag">Decisão compartilhada</span><p>Envolver RH, lideranças e equipes pertinentes, respeitando responsabilidades e governança.</p></div></div></div>'+foot()
}
function today(){return new Date().toISOString().slice(0,10)}
function diagnosisPage(){
return head('ETAPA 1 · COMPREENDER','Diagnóstico orientado','Um roteiro curto e obrigatório antes da criação de um plano. O objetivo é organizar o pensamento, não presumir causas nem repetir dados do BI.','<button class="btn primary" id="newDiagnosis">＋ Registrar diagnóstico</button>')+
note('<b>Como começar:</b> consulte o BI existente e descreva, sem copiar taxas ou horas, qual sinal, tendência ou situação motivou a análise. Não há campo para inserir valores do indicador.','good')+
'<div class="grid two"><div class="card"><div class="card-head"><div><h3>Perguntas que orientam a análise</h3><p>Use-as na conversa com a liderança e, quando pertinente, com as equipes.</p></div></div><div class="timeline"><div><b>1. Qual situação foi sinalizada?</b><small>Qual período, área ou processo merece atenção segundo a leitura do BI?</small></div><div><b>2. O que é fato e o que é hipótese?</b><small>Separar evidências disponíveis de explicações ainda não confirmadas.</small></div><div><b>3. Que fatores organizacionais podem estar envolvidos?</b><small>Escalas, dimensionamento, fluxos, condições de trabalho, comunicação, acolhimento, processos e apoio à liderança.</small></div><div><b>4. Quem precisa ser ouvido ou envolvido?</b><small>RH, gestores, lideranças e representantes das equipes, conforme o tema.</small></div><div><b>5. O que falta saber para decidir?</b><small>Registrar lacunas e como serão esclarecidas antes de definir a intervenção.</small></div></div></div><div class="card"><div class="card-head"><div><h3>Diagnósticos registrados</h3><p>O plano de ação será vinculado a um diagnóstico.</p></div></div>'+ (diagnoses.length?'<div class="cards">'+diagnoses.map(d=>'<div class="item"><div class="item-head"><h3>'+esc(d.title)+'</h3>'+status(d.stage)+'</div><p>'+esc(d.scope)+' · '+esc(d.dateLabel)+'</p><div class="meta"><span class="tag">'+esc(d.theme)+'</span></div><div class="item-actions"><button class="btn" data-viewdiag="'+d.id+'">Ver diagnóstico</button><button class="btn primary" data-createfrom="'+d.id+'">Criar plano vinculado</button></div></div>').join('')+'</div>':empty('Nenhum diagnóstico registrado.','Inicie um diagnóstico para habilitar o cadastro de planos de ação.'))+'</div></div>'+foot()
}
function planPage(){
return head('ETAPA 2 · INTERVIR','Planos de ação','Transforme fatores investigados em ações concretas, com responsáveis institucionais, prazos, recursos e evidências.','<button class="btn primary" id="newPlan">＋ Novo plano</button>')+
note('Para criar um plano, é necessário haver um diagnóstico registrado. Isso evita ações genéricas sem compreensão mínima da situação.','warn')+
'<div class="filters"><div class="field"><label>Status</label><select id="filterStatus"><option value="">Todos</option><option>Não iniciado</option><option>Em andamento</option><option>Concluído</option><option>Atrasado</option></select></div><div class="field"><label>Escopo / área</label><input id="filterScope" placeholder="Filtrar por hospital, setor ou área"></div></div>'+
'<div class="cards" id="planList">'+renderPlans(plans)+'</div>'+foot()
}
function monthBR(m){if(!m)return '—';let a=m.split('-');return a.length===2?a[1]+'/'+a[0]:m}
function monthDefault(){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function latestPercent(p){let h=(p.percentHistory||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));return h.length?h[h.length-1]:null}
function percentText(v){return v===undefined||v===null||v===''?'Não informado':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2})+'%'}
function changeText(p){let last=latestPercent(p);if(!last||p.baselinePercent===''||p.baselinePercent===undefined)return 'Sem comparação mensal';let diff=Number(last.percent)-Number(p.baselinePercent);return (diff>0?'+':'')+diff.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' p.p. desde a referência inicial'}
function daysSince(date){if(!date)return 999;return Math.floor((new Date(today()+'T12:00:00')-new Date(date+'T12:00:00'))/86400000)}
function renderPlans(list){if(!list.length)return empty('Nenhum plano de ação cadastrado.','Registre um diagnóstico e, em seguida, cadastre o plano com o percentual do mês anterior consultado no BI.');return list.map(p=>{let last=latestPercent(p),stale=daysSince(p.updated||p.created)>=15&&p.status!=='Concluído';return '<div class="item"><div class="item-head"><div><h3>'+esc(p.title)+'</h3><p>'+esc(p.scope)+' · Responsável: '+esc(p.owner)+'</p></div>'+status(planStatus(p))+'</div><div class="meta"><span class="tag">Prazo: '+dateBR(p.due)+'</span><span class="tag">Prioridade: '+esc(p.priority)+'</span><span class="tag">Progresso: '+Number(p.progress||0)+'%</span>'+(stale?'<span class="status warn">Sem atualização há 15+ dias</span>':'')+'</div><p><b>Referência inicial ('+monthBR(p.baselineMonth)+'):</b> '+percentText(p.baselinePercent)+' · <b>Último registro ('+(last?monthBR(last.month):'—')+'):</b> '+(last?percentText(last.percent):'Ainda não informado')+'</p><p><b>Variação:</b> '+changeText(p)+'</p><p><b>Objetivo:</b> '+esc(p.objective)+'</p><p><b>Diagnóstico:</b> '+esc(diagTitle(p.diagId))+'</p><div class="item-actions"><button class="btn" data-editplan="'+p.id+'">Abrir / atualizar</button>'+(p.status==='Concluído'?'<button class="btn" data-eval="'+p.id+'">Avaliar efetividade</button>':'')+'</div></div>'}).join('')}
function planStatus(p){if(p.status!=='Concluído'&&p.due&&p.due<today())return 'Atrasado';return p.status}
function diagTitle(id){let d=diagnoses.find(x=>x.id===id);return d?d.title:'Diagnóstico não localizado'}

return head('ETAPA 4 · VERIFICAR','Avaliação de efetividade','Concluir uma ação não significa que ela resolveu o problema. Registre a avaliação e consulte novamente o BI oficial para verificar a evolução do indicador pertinente.')+

function governance(){

ta versão demonstrativa</h3><p>Os registros ficam armazenados somente no navegador em que foram criados. Portanto, a atualização não é compartilhada em tempo real entre diferentes usuários nesta versão. Para operação institucional colaborativa serão necessários banco de dados compartilhado, autenticação, permissões, trilha de auditoria, segurança, governança LGPD e definição dos responsáveis.</p></div>'+foot()

function render(){

function bind(){
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
let n=$('newDiagnosis');if(n)n.onclick=()=>openDiagnosis();
let p=$('newPlan');if(p)p.onclick=()=>openPlan();
let fs=$('filterStatus'),fc=$('filterScope');function filter(){let list=plans.filter(x=>(!fs||!fs.value||planStatus(x)===fs.value)&&(!fc||!fc.value||x.scope.toLowerCase().includes(fc.value.toLowerCase())));$('planList').innerHTML=renderPlans(list);bindPlanButtons()}if(fs)fs.onchange=filter;if(fc)fc.oninput=filter;
document.querySelectorAll('[data-viewdiag]').forEach(b=>b.onclick=()=>showDiagnosis(b.dataset.viewdiag));
document.querySelectorAll('[data-createfrom]').forEach(b=>b.onclick=()=>openPlan(null,b.dataset.createfrom));
bindPlanButtons();
let lf=$('lessonForm');if(lf)lf.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(lf).entries());d.id=uid();d.created=today();lessons.unshift(d);persist();render();toast('Registro salvo neste navegador.')};
document.querySelectorAll('[data-dellesson]').forEach(b=>b.onclick=()=>{if(confirm('Excluir este registro demonstrativo?')){lessons=lessons.filter(x=>x.id!==b.dataset.dellesson);persist();render()}});
}
function bindPlanButtons(){

document.querySelectorAll('[data-eval]').forEach(b=>b.onclick=()=>openEvaluation(b.dataset.eval));

function openPlan(id,diagId){
if(!diagnoses.length){toast('Registre primeiro um diagnóstico.');go('diagnostico');return}
let old=plans.find(x=>x.id===id),p=old?JSON.parse(JSON.stringify(old)):{id:null,diagId:diagId||diagnoses[0].id,title:'',scope:diagnoses.find(d=>d.id===(diagId||diagnoses[0].id))?.scope||'',objective:'',actions:'',owner:'',support:'',due:'',priority:'Média',status:'Não iniciado',progress:0,baselineMonth:monthDefault(),baselinePercent:'',percentHistory:[],updates:[],history:[],supportRequested:false,created:today(),updated:today(),evidence:''};
let monthFields=id?'<div class="divider"></div><h3 style="font-size:13px">Referência mensal do BI</h3><p class="muted">Quando o BI disponibilizar o mês seguinte, registre aqui o percentual visualizado. Não informe horas nem valores financeiros.</p><div class="form-grid"><div class="field"><label>Mês consultado no BI</label><input name="monthEntry" type="month" value="'+monthDefault()+'"></div><div class="field"><label>Percentual de absenteísmo</label><input name="percentEntry" type="number" min="0" max="100" step="0.01" placeholder="Ex.: 3,42"></div></div>':'';
let updateFields=id?'<div class="divider"></div><h3 style="font-size:13px">Atualização operacional — registrar sempre que houver movimentação</h3><div class="form-grid"><div class="field"><label>Progresso da execução (%)</label><input name="progress" type="number" min="0" max="100" step="1" value="'+Number(p.progress||0)+'"></div><div class="field"><label>Status do plano</label><select name="status">'+['Não iniciado','Em andamento','Concluído'].map(x=>'<option '+(x===p.status?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>O que avançou ou foi realizado?</label><textarea name="updateText" placeholder="Descreva a ação realizada, etapa concluída ou próximo passo."></textarea></div><div class="field full"><label>Obstáculos, riscos ou motivo de atraso</label><textarea name="obstacles" placeholder="Registre impedimentos e providências necessárias."></textarea></div><div class="field full"><label>Necessidade de apoio / encaminhamento</label><textarea name="supportText" placeholder="Qual decisão, recurso ou articulação é necessária e de qual área?"></textarea></div><div class="field full"><label><input type="checkbox" name="supportRequested" '+(p.supportRequested?'checked':'')+' style="width:auto"> Manter sinalização de apoio solicitado</label></div><div class="field full"><label>Evidência ou entrega desta atualização</label><textarea name="updateEvidence" placeholder="Ex.: fluxo aprovado, rotina implantada, reunião realizada, material produzido. Não anexar dados pessoais."></textarea></div></div>':'';
$('modal').innerHTML='<h2>'+(id?'Atualizar plano de ação':'Novo plano de ação')+'</h2><form id="planForm"><div class="form-grid"><div class="field full"><label>Diagnóstico de origem</label><select name="diagId">'+diagnoses.map(d=>'<option value="'+d.id+'" '+(String(d.id)===String(p.diagId)?'selected':'')+'>'+esc(d.title)+' — '+esc(d.scope)+'</option>').join('')+'</select></div><div class="field full"><label>Título do plano</label><input name="title" required maxlength="140" value="'+esc(p.title)+'"></div><div class="field"><label>Hospital / setor / área</label><input name="scope" required value="'+esc(p.scope)+'"></div><div class="field"><label>Prioridade</label><select name="priority">'+['Baixa','Média','Alta'].map(x=>'<option '+(x===p.priority?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>Objetivo da intervenção</label><textarea name="objective" required>'+esc(p.objective)+'</textarea></div><div class="field full"><label>Ações pactuadas</label><textarea name="actions" required placeholder="Descreva entregas e etapas concretas.">'+esc(p.actions)+'</textarea></div><div class="field"><label>Responsável (função/equipe)</label><input name="owner" required value="'+esc(p.owner)+'" placeholder="Não informe nome pessoal"></div><div class="field"><label>Áreas de apoio necessárias</label><input name="support" value="'+esc(p.support)+'"></div><div class="field"><label>Prazo previsto</label><input name="due" type="date" required value="'+esc(p.due)+'"></div><div class="field"><label>Percentual do mês anterior (BI)</label><input name="baselinePercent" type="number" min="0" max="100" step="0.01" required value="'+esc(p.baselinePercent)+'" placeholder="Ex.: 3,42"><small>Digite o percentual visualizado no BI.</small></div><div class="field"><label>Mês de referência inicial</label><input name="baselineMonth" type="month" required value="'+esc(p.baselineMonth||monthDefault())+'"><small>Por padrão, vem preenchido com o mês anterior.</small></div><div class="field full"><label>Como será comprovada a execução?</label><textarea name="evidence" placeholder="Ex.: fluxo revisado, rotina implantada, reunião realizada, material elaborado — sem dados pessoais.">'+esc(p.evidence)+'</textarea></div></div>'+monthFields+updateFields+'<div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar plano</button></div></form>';
openModal();$('cancel').onclick=closeModal;
$('planForm').onsubmit=e=>{
 e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries()),now=today();
 if(d.baselinePercent===''||Number(d.baselinePercent)<0||Number(d.baselinePercent)>100){toast('Informe um percentual entre 0 e 100.');return}
 let saved=old?JSON.parse(JSON.stringify(old)):{id:uid(),created:now,percentHistory:[],updates:[],history:[]};
 let previousStatus=saved.status;
 ['diagId','title','scope','objective','actions','owner','support','due','priority','baselineMonth','baselinePercent','evidence'].forEach(k=>saved[k]=d[k]);
 saved.percentHistory=saved.percentHistory||[];saved.updates=saved.updates||[];saved.history=saved.history||[];
 if(id){
  saved.progress=Math.max(0,Math.min(100,Number(d.progress||0)));
  saved.status=d.status||saved.status;
  saved.supportRequested=d.supportRequested==='on';
  let operational=[d.updateText,d.obstacles,d.supportText,d.updateEvidence].some(x=>x&&x.trim());
  if(operational){let u={date:now,text:d.updateText||'',obstacles:d.obstacles||'',support:d.supportText||'',evidence:d.updateEvidence||'',progress:saved.progress,status:saved.status};saved.updates.unshift(u);saved.history.unshift({date:now,action:'Atualização operacional',detail:(d.updateText||d.obstacles||d.supportText||d.updateEvidence||'Progresso/status atualizado').slice(0,240)})}
  if(previousStatus!==saved.status)saved.history.unshift({date:now,action:'Mudança de status',detail:previousStatus+' → '+saved.status});
  if(d.monthEntry&&d.percentEntry!==''){
   let v=Number(d.percentEntry);if(v<0||v>100){toast('O percentual mensal deve estar entre 0 e 100.');return}
   let existing=saved.percentHistory.find(x=>x.month===d.monthEntry);
   if(existing){existing.percent=v;existing.date=now}else saved.percentHistory.push({month:d.monthEntry,percent:v,date:now});
   saved.percentHistory.sort((a,b)=>a.month.localeCompare(b.month));
   saved.history.unshift({date:now,action:'Percentual mensal atualizado',detail:'BI · '+monthBR(d.monthEntry)+': '+percentText(v)});
  }
 }else{
  saved.progress=0;saved.status='Não iniciado';saved.supportRequested=false;
  saved.percentHistory=[{month:saved.baselineMonth,percent:Number(saved.baselinePercent),date:now}];
  saved.history.unshift({date:now,action:'Plano criado',detail:'Referência inicial registrada a partir do BI: '+monthBR(saved.baselineMonth)+' · '+percentText(saved.baselinePercent)});
 }
 if(saved.status==='Concluído'){saved.progress=100;saved.completed=saved.completed||now}
 saved.updated=now;
 if(old)plans=plans.map(x=>x.id===old.id?saved:x);else plans.unshift(saved);
 persist();closeModal();render();toast('Plano salvo. Atualizações e histórico registrados neste navegador.')
};
}
function openEvaluation(id){
let p=plans.find(x=>x.id===id);if(!p)return;if(p.status!=='Concluído'){toast('Conclua a execução antes de avaliar.');return}
let e=p.evaluation||{result:'Inconclusivo',period:'',biReviewed:'Sim',interpretation:'',contribution:'Ainda não é possível afirmar',decision:'Manter e acompanhar',learning:''};
let last=latestPercent(p),delta=last?Number(last.percent)-Number(p.baselinePercent):null;
$('modal').innerHTML='<h2>Avaliar efetividade</h2><p>'+esc(p.title)+'</p><div class="notice good"><b>Referência inicial:</b> '+monthBR(p.baselineMonth)+' — '+percentText(p.baselinePercent)+'<br><b>Último percentual registrado:</b> '+(last?monthBR(last.month)+' — '+percentText(last.percent):'Ainda não registrado')+(delta===null?'':'<br><b>Variação em relação à referência inicial:</b> '+(delta>0?'+':'')+delta.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' pontos percentuais')+'<br><small>Valores digitados manualmente a partir da visualização do BI; esta ferramenta não acessa a base do BI.</small></div><form id="evalForm"><div class="form-grid"><div class="field"><label>Resultado observado</label><select name="result">'+['Melhora observada','Sem mudança relevante','Piora observada','Inconclusivo'].map(x=>'<option '+(x===e.result?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>BI consultado novamente?</label><select name="biReviewed"><option '+(e.biReviewed==='Sim'?'selected':'')+'>Sim</option><option '+(e.biReviewed==='Não'?'selected':'')+'>Não</option></select></div><div class="field full"><label>Período consultado no BI</label><input name="period" value="'+esc(e.period)+'" placeholder="Ex.: mês seguinte à implantação"></div><div class="field full"><label>Interpretação da equipe</label><textarea name="interpretation" required>'+esc(e.interpretation)+'</textarea></div><div class="field full"><label>É possível atribuir contribuição à intervenção?</label><select name="contribution">'+['Há evidências de contribuição','Contribuição possível, mas não confirmada','Ainda não é possível afirmar','Não há evidência de contribuição'].map(x=>'<option '+(x===e.contribution?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>Decisão após avaliação</label><select name="decision">'+['Manter e acompanhar','Ajustar as ações','Ampliar para outros contextos','Substituir a intervenção','Encerrar a intervenção'].map(x=>'<option '+(x===e.decision?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>Aprendizados e próximos passos</label><textarea name="learning">'+esc(e.learning)+'</textarea></div></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar avaliação</button></div></form>';
openModal();$('cancel').onclick=closeModal;$('evalForm').onsubmit=ev=>{ev.preventDefault();p.evaluation=Object.fromEntries(new FormData(ev.target).entries());p.evaluated=today();p.history=p.history||[];p.history.unshift({date:today(),action:'Avaliação de efetividade',detail:p.evaluation.result+' · '+p.evaluation.decision});p.updated=today();persist();closeModal();render();toast('Avaliação registrada.')};
}
function openModal(){$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
$('roleSelect').onchange=e=>{role=e.target.value;toast('Perfil demonstrativo selecionado. Não altera permissões reais.')};
$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
$('modalBg').onclick=e=>{if(e.target===$('modalBg'))closeModal()};
render();
})();
</script>
