<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.banner{background:#fff3d8;color:#76510b;text-align:center;padding:8px 14px;font-size:11px;font-weight:850;letter-spacing:.06em;position:sticky;top:0;z-index:30;border-bottom:1px solid #efdcae}.shell{display:flex;min-height:calc(100vh - 36px)}aside{width:252px;background:var(--navy);color:#dce8f1;padding:20px 14px;display:flex;flex-direction:column;flex-shrink:0}.brand{padding:5px 12px 21px;border-bottom:1px solid #ffffff25}.brand-mark{width:36px;height:36px;border-radius:10px;background:#21877f;display:grid;place-items:center;color:white;font-weight:900;font-size:17px;margin-bottom:11px}.brand strong{display:block;color:#fff;font-size:14px;line-height:1.35}.brand small{color:#a9bfd0;font-size:11px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#91abc0;padding:20px 12px 6px}.nav button{width:100%;border:0;background:transparent;color:#d4e0e9;text-align:left;padding:9px 12px;border-radius:8px;margin:2px 0;display:flex;gap:10px;align-items:center;font-size:12px}.nav button:hover,.nav button.active{background:#ffffff19;color:#fff}.ico{width:18px;text-align:center;font-size:15px}.side-note{margin-top:auto;padding:14px 12px 0;border-top:1px solid #ffffff25;color:#a9bfd0;font-size:10px}.side-note b{display:block;color:white;font-size:12px;margin-bottom:4px}main{min-width:0;flex:1}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:12px}.crumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.role{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:white;color:var(--ink);font-size:11px;max-width:240px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#e3f1ef;color:#176e68;font-weight:850}.content{max-width:1420px;margin:auto;padding:27px 30px 48px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:19px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--teal);font-weight:850}.page-head h1{font-size:25px;line-height:1.2;color:var(--navy);margin:5px 0 7px;letter-spacing:-.03em}.page-head p{margin:0;color:var(--muted);max-width:800px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:8px;font-size:11px;font-weight:750}.btn:hover{border-color:#9db4c6}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.btn.teal{background:var(--teal);color:white;border-color:var(--teal)}.btn.danger{color:var(--red)}.grid{display:grid;gap:14px}.two{grid-template-columns:1.2fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{color:var(--navy);margin:0}.card h3{font-size:14px}.card p{color:var(--muted);font-size:12px}.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}.card-head p{margin:4px 0 0}.notice{padding:12px 14px;border:1px solid #d8e7ed;background:#eef6f8;color:#36586b;border-radius:9px;font-size:12px;margin-bottom:15px}.notice.warn{background:#fff8e9;border-color:#efdfbb;color:#785a23}.notice.good{background:#edf7f3;border-color:#d1e9df;color:#286b5d}.notice.red{background:#fbefef;border-color:#efd6d7;color:#88474b}.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:16px 0}.flow-step{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff;min-height:116px}.flow-step .n{width:24px;height:24px;border-radius:7px;background:#eaf3f5;color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:850;margin-bottom:8px}.flow-step b{display:block;color:var(--navy);font-size:12px}.flow-step small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.list{display:grid;gap:9px}.list-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border:0}.list-icon{width:28px;height:28px;border-radius:8px;background:#eef4f7;display:grid;place-items:center;color:var(--blue);flex-shrink:0}.list-row b{display:block;color:var(--navy);font-size:12px}.list-row small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.tag{display:inline-flex;padding:4px 8px;border-radius:6px;background:#f0f4f6;color:#536a7c;font-size:10px;font-weight:700}.status{display:inline-flex;padding:4px 8px;border-radius:99px;background:#edf5f2;color:#287660;font-size:10px;font-weight:800;white-space:nowrap}.status.warn{background:#fff4df;color:#92620f}.status.bad{background:#faeaea;color:#a3484e}.status.gray{background:#eef1f4;color:#617184}.filters{display:flex;flex-wrap:wrap;align-items:end;gap:10px;background:#fff;border:1px solid var(--line);padding:13px;border-radius:10px;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:4px;min-width:140px;flex:1}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;background:white;color:var(--ink);font-size:12px}.field textarea{min-height:76px;resize:vertical}.field small{font-size:10px;color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:white}table{width:100%;border-collapse:collapse;min-width:600px}th{text-align:left;background:#f7f9fa;color:var(--muted);font-size:10px;text-transform:uppercase;padding:10px 12px}td{padding:11px 12px;border-top:1px solid var(--line);font-size:11px}td b{color:var(--navy)}.empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.cards{display:grid;gap:11px}.item{background:white;border:1px solid var(--line);border-radius:10px;padding:14px}.item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{margin:0;color:var(--navy);font-size:13px}.item p{margin:6px 0;color:var(--muted);font-size:11px}.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.modal-bg{position:fixed;inset:0;background:#0d2236aa;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}.modal-bg.show{display:flex}.modal{background:white;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:21px;box-shadow:0 20px 60px #0003}.modal h2{font-size:18px;color:var(--navy);margin:0 0 15px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:18px;bottom:18px;background:#173c59;color:white;padding:11px 15px;border-radius:9px;z-index:90;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;font-size:12px}.toast.show{opacity:1;transform:translateY(0)}.mobile{display:none}.footer{margin-top:20px;text-align:center;color:#81909d;font-size:10px}.timeline{border-left:2px solid #dce8ee;padding-left:16px;margin-left:6px;display:grid;gap:13px}.timeline b{display:block;color:var(--navy);font-size:12px}.timeline small{color:var(--muted);font-size:10px}.timeline div{position:relative}.timeline div:before{content:"";position:absolute;left:-21px;top:5px;width:8px;height:8px;background:var(--teal);border-radius:50%}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.choice-grid .checkline{margin:0}.checkline{display:flex;gap:9px;align-items:flex-start;padding:8px 0;font-size:12px}.checkline input{margin-top:3px}.divider{height:1px;background:var(--line);margin:13px 0}
@media(max-width:1050px){.four{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}
@media(max-width:740px){aside{position:fixed;z-index:50;left:-265px;top:36px;bottom:0;transition:.2s}aside.open{left:0}.topbar{height:58px;padding:0 13px}.content{padding:19px 13px 35px}.page-head{flex-direction:column}.page-head h1{font-size:22px}.mobile{display:inline-flex}.role{max-width:150px}.three,.four{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:430px){.three,.four,.flow{grid-template-columns:1fr}.top-actions{gap:5px}.role{max-width:125px;font-size:10px}}

<div class="banner">AMBIENTE DEMONSTRATIVO — NÃO INSERIR DADOS PESSOAIS OU INFORMAÇÕES REAIS DE TRABALHADORES</div>
<div class="shell">
<aside id="sidebar">
 <div class="brand"><div class="brand-mark">F</div><strong>Gestão Estratégica<br>do Absenteísmo</strong><small>FGH · Apoio à gestão de ações</small></div>
 <div class="nav-label">Ciclo de gestão</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="inicio"><span class="ico">⌂</span>Início</button>

 </nav>

<main>
 <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn mobile" id="menuBtn">☰</button><span class="crumb">FGH / <b id="crumb">Início</b></span></div><div class="top-actions"><select class="role" id="roleSelect" aria-label="Perfil demonstrativo"><option value="admin">Perfil: Administração FGH</option><option value="institucional">Gestão institucional</option><option value="rh">RH institucional</option><option value="hospital">Gestão hospitalar</option><option value="setor">Gestão setorial</option><option value="consulta">Consulta</option></select><div class="avatar">FG</div></div></header>

<script>
(function(){
const KEY='fgh_absenteismo_gestao_v2';
let diagnoses=read('diagnoses',[]),plans=read('plans',[]),lessons=read('lessons',[]),page='inicio',role='admin';
function read(k,def){try{const x=JSON.parse(localStorage.getItem(KEY+'_'+k)||'null');return Array.isArray(x)?x:def}catch(e){return def}}
function persist(){localStorage.setItem(KEY+'_diagnoses',JSON.stringify(diagnoses));localStorage.setItem(KEY+'_plans',JSON.stringify(plans));localStorage.setItem(KEY+'_lessons',JSON.stringify(lessons))}
function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateBR(s){if(!s)return '—';let a=s.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:s}
function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function go(p){page=p;render();$('sidebar').classList.remove('open');window.scrollTo(0,0)}
function head(k,t,d,action){return '<div class="page-head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></div>'+(action||'')+'</div>'}
function note(t,kind){return '<div class="notice '+(kind||'')+'">'+t+'</div>'}
function status(s){let c=s==='Concluído'||s==='Efetiva'?'':s==='Em andamento'||s==='Parcial'?'warn':s==='Atrasado'||s==='Não efetiva'?'bad':'gray';return '<span class="status '+c+'">'+esc(s)+'</span>'}
function empty(t,sub){return '<div class="card empty"><b>'+t+'</b><br>'+sub+'</div>'}
function foot(){return '<div class="footer">Protótipo demonstrativo · Sem conexão com BI/RH · Registros armazenados somente neste navegador.</div>'}
function home(){
let active=plans.filter(p=>p.status!=='Concluído'),testing=active.filter(p=>p.status==='Em andamento'),support=active.filter(p=>p.supportRequested);
return head('GESTÃO ESTRATÉGICA · FGH','Mudar a rotina para transformar resultados','Uma ferramenta para sair da identificação do problema e chegar a mudanças concretas no trabalho. O BI informa o cenário; aqui, a liderança e a equipe experimentam soluções e aprendem com a prática.','<button class="btn primary" data-go="diagnostico">＋ Começar por uma situação</button>')+
note('<b>Não é mais um formulário de prestação de contas.</b> Registre somente o necessário para transformar uma situação: o que está dificultando o trabalho, que mudança vale testar, quem precisa participar e o que aconteceu na prática. Sem culpabilizar trabalhadores.','good')+
'<div class="flow"><div class="flow-step"><div class="n">1</div><b>Perceber</b><small>Identificar uma dificuldade concreta na rotina do setor.</small></div><div class="flow-step"><div class="n">2</div><b>Escolher uma mudança</b><small>Definir algo viável que possa ser testado, não um plano extenso.</small></div><div class="flow-step"><div class="n">3</div><b>Experimentar</b><small>Colocar a mudança em prática com quem realiza o trabalho.</small></div><div class="flow-step"><div class="n">4</div><b>Aprender e ajustar</b><small>Observar o que melhorou, o que travou e o que precisa mudar.</small></div></div>'+
'<div class="grid three"><div class="card"><span class="eyebrow">Situações identificadas</span><h2 style="font-size:27px;margin-top:7px">'+diagnoses.length+'</h2><p>Dificuldades concretas registradas</p><button class="btn" data-go="diagnostico">Ver situações</button></div><div class="card"><span class="eyebrow">Mudanças em teste</span><h2 style="font-size:27px;margin-top:7px">'+testing.length+'</h2><p>Experimentos em andamento</p><button class="btn" data-go="monitoramento">Acompanhar</button></div><div class="card"><span class="eyebrow">Mudanças ainda abertas</span><h2 style="font-size:27px;margin-top:7px">'+active.length+'</h2><p>Inclui ações em preparação ou teste</p><button class="btn" data-go="planos">Ver mudanças</button></div></div>'+
'<div class="grid two" style="margin-top:14px"><div class="card"><h3>O que pode ser transformado?</h3><div class="list"><div class="list-row"><div class="list-icon">↔</div><div><b>Organização das escalas e cobertura</b><small>Previsibilidade, substituições, passagem entre turnos e distribuição de profissionais.</small></div></div><div class="list-row"><div class="list-icon">▦</div><div><b>Distribuição das atividades</b><small>Equilíbrio de tarefas, prioridades, fluxos e retrabalho.</small></div></div><div class="list-row"><div class="list-icon">♡</div><div><b>Condições e apoio para trabalhar</b><small>Escuta, acolhimento, comunicação, recursos e suporte das lideranças.</small></div></div><div class="list-row"><div class="list-icon">✦</div><div><b>Pequenas melhorias na rotina</b><small>Testes simples que possam ser avaliados e ajustados com a equipe.</small></div></div></div></div><div class="card"><h3>Como usar sem burocratizar</h3><div class="timeline"><div><b>Comece pelo que incomoda na prática</b><small>Não precisa descobrir a causa completa nem preencher um diagnóstico longo.</small></div><div><b>Escolha uma mudança pequena e possível</b><small>Evite ações genéricas como “conscientizar” ou “melhorar a comunicação” sem dizer o que mudará.</small></div><div><b>Volte quando houver algo novo</b><small>Atualize quando testar, encontrar uma barreira ou ajustar a solução — não por obrigação semanal.</small></div><div><b>Use o BI como contexto</b><small>O percentual mensal pode complementar a análise. Não é a única medida de mudança nem prova de causalidade.</small></div></div></div></div>'+
note('<b>Importante:</b> o BI institucional continua sendo a fonte oficial do indicador. Esta ferramenta não acessa sua base. Não registre nomes, matrículas, dados de saúde ou informações que identifiquem trabalhadores. Os registros deste protótipo ficam apenas neste navegador.','warn')+foot()
}
function today(){return new Date().toISOString().slice(0,10)}
function diagnosisPage(){
return head('COMECE PELO TRABALHO REAL','Que situação precisa mudar?','Não é necessário fazer um diagnóstico formal. Registre uma dificuldade concreta que esteja afetando a rotina, a equipe ou a capacidade de manter o trabalho.','<button class="btn primary" id="newDiagnosis">＋ Registrar situação</button>')+
note('<b>Uma boa descrição é simples:</b> “Estamos tendo dificuldade para cobrir ausências no turno da noite” ou “A distribuição das atividades está concentrando a sobrecarga”. Não tente apontar culpados nem adivinhar causas.','good')+
'<div class="grid two"><div class="card"><h3>Observe a rotina</h3><div class="list"><div class="list-row"><div class="list-icon">◷</div><div><b>Quando a dificuldade aparece?</b><small>Em determinados turnos, dias, períodos ou momentos de maior demanda?</small></div></div><div class="list-row"><div class="list-icon">↔</div><div><b>O que fica mais difícil?</b><small>Cobrir ausências, distribuir tarefas, manter fluxos ou apoiar a equipe?</small></div></div><div class="list-row"><div class="list-icon">◎</div><div><b>Quem precisa participar da mudança?</b><small>Inclua quem conhece e realiza o trabalho, não apenas quem acompanha os indicadores.</small></div></div></div></div><div class="card"><h3>Situações registradas</h3><p>Ao registrar uma situação, você já poderá propor uma mudança prática para testá-la.</p>'+(diagnoses.length?'<div class="cards">'+diagnoses.map(d=>'<div class="item"><div class="item-head"><h3>'+esc(d.title)+'</h3>'+status(d.stage)+'</div><p>'+esc(d.scope)+' · '+esc(d.dateLabel)+'</p><p>'+esc(d.signal||'')+'</p><div class="item-actions"><button class="btn" data-viewdiag="'+d.id+'">Ver situação</button><button class="btn primary" data-createfrom="'+d.id+'">Propor mudança</button></div></div>').join('')+'</div>':empty('Nenhuma situação registrada.','Comece por uma dificuldade concreta observada no trabalho.'))+'</div></div>'+foot()
}
function planPage(){
return head('DA IDEIA À PRÁTICA','Que mudança vamos testar?','Escolha uma resposta concreta para uma situação identificada. Prefira um teste pequeno, que possa ser colocado em prática e revisto com a equipe.','<button class="btn primary" id="newPlan">＋ Propor mudança</button>')+
note('<b>Não precisa montar um projeto completo.</b> Basta combinar o que será diferente na rotina, qual será o primeiro teste, quem precisa participar e quando vocês vão conversar sobre o resultado.','good')+
'<div class="filters"><div class="field"><label>Situação</label><select id="filterStatus"><option value="">Todas</option><option>Não iniciado</option><option>Em andamento</option><option>Concluído</option><option>Atrasado</option></select></div><div class="field"><label>Hospital / setor</label><input id="filterScope" placeholder="Filtrar por local"></div></div><div class="cards" id="planList">'+renderPlans(plans)+'</div>'+foot()
}
function monthBR(m){if(!m)return '—';let a=m.split('-');return a.length===2?a[1]+'/'+a[0]:m}
function monthDefault(){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function latestPercent(p){let h=(p.percentHistory||[]).slice().sort((a,b)=>a.month.localeCompare(b.month));return h.length?h[h.length-1]:null}
function nextMonthValue(p){let last=latestPercent(p);let d=last&&last.month?new Date(last.month+'-01T12:00:00'):new Date(monthDefault()+'-01T12:00:00');d.setMonth(d.getMonth()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function percentText(v){return v===undefined||v===null||v===''?'Não informado':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2})+'%'}
function changeText(p){let last=latestPercent(p);if(!last||p.baselinePercent===''||p.baselinePercent===undefined)return 'Sem comparação mensal';let diff=Number(last.percent)-Number(p.baselinePercent);return (diff>0?'+':'')+diff.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' p.p. desde a referência inicial'}
function daysSince(date){if(!date)return 999;return Math.floor((new Date(today()+'T12:00:00')-new Date(date+'T12:00:00'))/86400000)}

if(!diagnoses.length){toast('Registre primeiro uma situação concreta do trabalho.');go('diagnostico');return}
let old=plans.find(x=>x.id===id),d0=diagnoses.find(d=>d.id===(diagId||(old&&old.diagId)||diagnoses[0].id)),p=old?JSON.parse(JSON.stringify(old)):{id:null,diagId:diagId||diagnoses[0].id,title:'',scope:d0?.scope||'',objective:'',actions:'',owner:'',support:'',due:'',priority:'Média',status:'Não iniciado',progress:0,baselineMonth:'',baselinePercent:'',percentHistory:[],updates:[],history:[],supportRequested:false,created:today(),updated:today(),evidence:''};
let updateFields=id?'<div class="divider"></div><h3 style="font-size:14px">O que aconteceu na prática?</h3><div class="form-grid"><div class="field"><label>Como está a mudança?</label><select name="status">'+['Não iniciado','Em andamento','Concluído'].map(x=>'<option '+(x===p.status?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>O que foi testado ou mudou na rotina?</label><textarea name="updateText" placeholder="Conte o que aconteceu de concreto."></textarea></div><div class="field full"><label>O que a equipe percebeu? (opcional)</label><textarea name="obstacles" placeholder="O que ajudou, o que dificultou ou que efeito inesperado apareceu?"></textarea></div><div class="field full"><label>Qual deve ser o próximo ajuste? (opcional)</label><textarea name="supportText" placeholder="Ex.: manter o teste, adaptar o fluxo, envolver outra área."></textarea></div><div class="field full"><label><input type="checkbox" name="supportRequested" '+(p.supportRequested?'checked':'')+' style="width:auto"> Esta mudança depende de apoio de outra área</label></div><div class="field full"><label>Que apoio é necessário? (opcional)</label><textarea name="updateEvidence" placeholder="Descreva a decisão, recurso ou articulação que falta."></textarea></div></div><details style="margin-top:12px"><summary>Acrescentar percentual mensal do BI (opcional)</summary><p class="muted">Use somente quando o novo mês estiver disponível no BI. Este dado complementa a avaliação da mudança.</p><div class="form-grid"><div class="field"><label>Mês</label><input name="monthEntry" type="month" value="'+(nextMonthValue(p)||monthDefault())+'"></div><div class="field"><label>Percentual (%)</label><input name="percentEntry" type="number" min="0" max="100" step="0.01" placeholder="Opcional"></div></div></details>':'';
let diagOptions=diagnoses.map(d=>'<option value="'+d.id+'" '+(String(d.id)===String(p.diagId)?'selected':'')+'>'+esc(d.title)+' — '+esc(d.scope)+'</option>').join('');
$('modal').innerHTML='<h2>'+(id?'Registrar o que aconteceu':'Escolher uma mudança para testar')+'</h2><p class="muted">'+(id?'Volte aqui quando houver algo novo na prática. Não precisa atualizar por calendário.':'Escolha uma mudança pequena, concreta e possível de experimentar com a equipe.')+'</p><form id="planForm"><div class="form-grid"><div class="field full"><label>Qual situação queremos transformar?</label><select name="diagId">'+diagOptions+'</select></div><div class="field full"><label>O que queremos fazer diferente?</label><input name="title" required maxlength="140" value="'+esc(p.title)+'" placeholder="Ex.: testar uma nova forma de organizar a cobertura do turno"></div><div class="field full"><label>Que diferença esperamos ver na rotina?</label><textarea name="objective" required placeholder="Ex.: distribuir a cobertura de forma mais previsível e equilibrada.">'+esc(p.objective)+'</textarea></div><div class="field full"><label>Qual será o primeiro teste ou passo concreto?</label><textarea name="actions" required placeholder="Descreva o que será feito, onde e como começa.">'+esc(p.actions)+'</textarea></div><div class="field"><label>Quem precisa participar ou acompanhar?</label><input name="owner" required value="'+esc(p.owner)+'" placeholder="Ex.: liderança e equipe do setor"></div><div class="field"><label>Quando vamos rever o teste?</label><input name="due" type="date" required value="'+esc(p.due)+'"></div><div class="field full"><label>Que apoio pode ser necessário? (opcional)</label><input name="support" value="'+esc(p.support||'')+'" placeholder="Ex.: RH, gestão hospitalar, saúde ocupacional"></div><div class="field full"><details><summary>Consultar e registrar percentual do BI (opcional)</summary><p class="muted">O BI é a fonte oficial. Não é necessário informar percentual para começar a mudança.</p><div class="form-grid"><div class="field"><label>Mês de referência</label><input name="baselineMonth" type="month" value="'+esc(p.baselineMonth||'')+'"></div><div class="field"><label>Percentual (%)</label><input name="baselinePercent" type="number" min="0" max="100" step="0.01" value="'+esc(p.baselinePercent||'')+'" placeholder="Opcional"></div></div></details></div></div>'+updateFields+'<div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">'+(id?'Salvar atualização':'Começar a mudança')+'</button></div></form>';
openModal();$('cancel').onclick=closeModal;
$('planForm').onsubmit=e=>{
e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries()),now=today();
let saved=old?JSON.parse(JSON.stringify(old)):{id:uid(),created:now,percentHistory:[],updates:[],history:[]};
let previousStatus=saved.status;
['diagId','title','objective','actions','owner','due','support'].forEach(k=>{if(d[k]!==undefined)saved[k]=d[k]});
if(!id){saved.scope=(diagnoses.find(x=>x.id===d.diagId)||d0||{}).scope||'';saved.status='Não iniciado';saved.progress=0;saved.supportRequested=false;saved.baselineMonth=d.baselineMonth||'';saved.baselinePercent=d.baselinePercent||'';if(saved.baselineMonth&&saved.baselinePercent!=='')saved.percentHistory.push({month:saved.baselineMonth,percent:Number(saved.baselinePercent),date:now});saved.history.unshift({date:now,action:'Mudança proposta',detail:saved.actions})}
else{
saved.status=d.status||saved.status;saved.progress=saved.status==='Concluído'?100:saved.status==='Em andamento'?50:0;saved.supportRequested=d.supportRequested==='on';
let operational=[d.updateText,d.obstacles,d.supportText,d.updateEvidence].some(x=>x&&x.trim());
if(operational){saved.updates.unshift({date:now,text:d.updateText||'',obstacles:d.obstacles||'',support:d.supportText||'',evidence:d.updateEvidence||'',progress:saved.progress,status:saved.status});saved.history.unshift({date:now,action:'Aprendizado da execução',detail:[d.updateText,d.obstacles,d.supportText,d.updateEvidence].filter(Boolean).join(' · ').slice(0,500)})}
if(previousStatus!==saved.status)saved.history.unshift({date:now,action:'Situação da mudança',detail:previousStatus+' → '+saved.status});
if(d.monthEntry&&d.percentEntry!==''){let v=Number(d.percentEntry);if(v<0||v>100){toast('O percentual deve estar entre 0 e 100.');return}let existing=saved.percentHistory.find(x=>x.month===d.monthEntry);if(existing){existing.percent=v;existing.date=now}else saved.percentHistory.push({month:d.monthEntry,percent:v,date:now});saved.percentHistory.sort((a,b)=>a.month.localeCompare(b.month))}
}
if(saved.baselineMonth&&saved.baselinePercent!==''&&!saved.percentHistory.some(x=>x.month===saved.baselineMonth))saved.percentHistory.push({month:saved.baselineMonth,percent:Number(saved.baselinePercent),date:now});
if(saved.status==='Concluído'){saved.progress=100;saved.completed=saved.completed||now}
saved.updated=now;
if(old)plans=plans.map(x=>x.id===old.id?saved:x);else plans.unshift(saved);
persist();closeModal();render();toast('Mudança registrada neste navegador.')
};
}
function openEvaluation(id){
let p=plans.find(x=>x.id===id);if(!p)return;
let e=p.evaluation||{result:'Ainda em observação',period:'',biReviewed:'Não',interpretation:'',contribution:'Não avaliado',decision:'Ajustar e continuar',learning:''};
$('modal').innerHTML='<h2>O que aprendemos com este teste?</h2><p>'+esc(p.title)+'</p><form id="evalForm"><div class="form-grid"><div class="field full"><label>O que aconteceu com a mudança?</label><select name="result">'+['Funcionou como esperado','Melhorou parcialmente','Não produziu a mudança esperada','Criou dificuldade inesperada','Ainda precisamos observar'].map(x=>'<option '+(x===e.result?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>O que a equipe percebeu na rotina?</label><textarea name="interpretation" required placeholder="Descreva o que mudou, o que facilitou e o que ainda precisa ser resolvido.">'+esc(e.interpretation)+'</textarea></div><div class="field full"><label>O que vamos fazer agora?</label><select name="decision">'+['Manter como nova prática','Ajustar e continuar testando','Ampliar para outro turno ou setor','Interromper e tentar outra solução','Observar por mais tempo'].map(x=>'<option '+(x===e.decision?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field full"><label>O que vale compartilhar com outras equipes? (opcional)</label><textarea name="learning" placeholder="Condições para funcionar, cuidados e aprendizados.">'+esc(e.learning)+'</textarea></div><div class="field full"><details><summary>Relacionar com o indicador do BI (opcional)</summary><div class="form-grid"><div class="field"><label>BI consultado novamente?</label><select name="biReviewed"><option '+(e.biReviewed==='Sim'?'selected':'')+'>Não</option><option '+(e.biReviewed==='Sim'?'selected':'')+'>Sim</option></select></div><div class="field"><label>Período consultado</label><input name="period" value="'+esc(e.period||'')+'" placeholder="Ex.: mês de referência"></div></div><small class="muted">A evolução do percentual é um sinal complementar e não prova, sozinha, que a mudança causou o resultado.</small></details></div></div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancelar</button><button class="btn primary">Salvar aprendizado</button></div></form>';
openModal();$('cancel').onclick=closeModal;$('evalForm').onsubmit=ev=>{ev.preventDefault();p.evaluation=Object.fromEntries(new FormData(ev.target).entries());p.evaluated=today();p.history=p.history||[];p.history.unshift({date:today(),action:'Aprendizado registrado',detail:p.evaluation.result+' · '+p.evaluation.decision});p.updated=today();persist();closeModal();render();toast('Aprendizado registrado.')};
}
function openModal(){$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show')}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
$('roleSelect').onchange=e=>{role=e.target.value;toast('Perfil demonstrativo selecionado. Não altera permissões reais.')};
$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');
$('modalBg').onclick=e=>{if(e.target===$('modalBg'))closeModal()};
render();
})();
</script>
