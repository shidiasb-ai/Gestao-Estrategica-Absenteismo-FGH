:#e3f1ef;color:#176e68;display:grid;place-items:center;font-weight:800}.content{padding:28px 30px 50px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--teal);font-weight:800}.page-head h1{font-size:25px;line-height:1.2;color:var(--navy);margin:5px 0 7px;letter-spacing:-.03em}.page-head p{margin:0;color:var(--muted);max-width:760px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:8px;font-weight:700;font-size:12px}.btn:hover{border-color:#9eb4c8}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.teal{background:var(--teal);color:#fff;border-color:var(--teal)}.btn.danger{color:var(--red)}.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:18px}.field{display:flex;flex-direction:column;gap:4px;min-width:135px}.field label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:7px;padding:8px 9px;background:#fff;color:var(--ink);min-width:0}.field textarea{min-height:75px;resize:vertical}.grid{display:grid;gap:15px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow);min-width:0}.kpi-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:700}.kpi-icon{width:30px;height:30px;border-radius:9px;background:#eef4f8;display:grid;place-items:center;color:var(--blue);font-size:15px}.kpi-value{font-size:27px;font-weight:850;letter-spacing:-.04em;color:var(--navy);margin:11px 0 2px}.kpi-foot{font-size:11px;color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.two-col{grid-template-columns:1.45fr 1fr;margin-bottom:16px}.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}.card-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}.card-title h3{font-size:14px;color:var(--navy);margin:0}.card-title p{font-size:11px;color:var(--muted);margin:3px 0 0}.chart{height:220px;display:flex;align-items:end;gap:13px;padding:18px 8px 24px;border-bottom:1px solid var(--line);position:relative}.bar-group{height:100%;flex:1;display:flex;align-items:end;justify-content:center;gap:4px;position:relative}.bar{width:min(24px,38%);border-radius:5px 5px 0 0;background:#8eb9ce;position:relative;min-height:3px}.bar.target{background:#2d8c83}.bar span{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);white-space:nowrap}.bar-labels{display:flex;gap:13px;padding:7px 8px 0}.bar-labels span{flex:1;text-align:center;font-size:10px;color:var(--muted)}.legend{display:flex;gap:14px;font-size:10px;color:var(--muted);margin-top:12px}.dot{width:8px;height:8px;display:inline-block;border-radius:2px;margin-right:5px}.progress-list{display:grid;gap:15px}.progress-row{display:grid;grid-template-columns:110px 1fr 45px;gap:10px;align-items:center;font-size:11px}.progress-track{height:8px;background:#edf1f5;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:#2d8c83;border-radius:99px}.progress-fill.warn{background:#d5a34e}.progress-fill.bad{background:#c66b70}.progress-row b{text-align:right;color:var(--navy)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;background:#f7f9fb;color:#718096;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:11px 13px;white-space:nowrap}td{padding:12px 13px;border-top:1px solid var(--line);font-size:12px}td strong{color:var(--navy)}.muted{color:var(--muted)}.status{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:800;background:#edf5f3;color:#28796e;white-space:nowrap}.status.warn{background:#fff4df;color:#94630e}.status.bad{background:#fae9e9;color:#a4484e}.status.gray{background:#eef1f4;color:#617184}.section{margin-top:17px}.section h2{font-size:15px;color:var(--navy);margin:0 0 10px}.notice{padding:12px 14px;border-radius:9px;background:#edf5f8;border:1px solid #d6e7ee;color:#37586c;font-size:12px;margin-bottom:15px}.notice.warn{background:#fff8e9;border-color:#f1dfb8;color:#795b21}.notice.green{background:#edf7f3;border-color:#d1e9df;color:#286a5c}.empty{padding:30px;text-align:center;color:var(--muted)}.cards-list{display:grid;gap:12px}.action-card{border:1px solid var(--line);border-radius:10px;padding:15px;background:#fff}.action-head{display:flex;justify-content:space-between;gap:12px}.action-head h3{font-size:13px;margin:0;color:var(--navy)}.action-card p{font-size:11px;color:var(--muted);margin:7px 0}.action-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.tag{font-size:10px;padding:4px 7px;border-radius:5px;background:#f1f4f7;color:#526578}.modal-backdrop{position:fixed;inset:0;background:#0b1e32a8;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.show{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:22px;box-shadow:0 20px 60px #0003}.modal h2{font-size:18px;color:var(--navy);margin:0 0 16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;right:20px;bottom:20px;background:#183b59;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:80;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.mobile-menu{display:none}.footer-note{margin-top:22px;color:var(--muted);font-size:10px;text-align:center}.pill{border:1px solid #dce5ec;border-radius:99px;padding:5px 9px;font-size:10px;color:#5c7184}.stat-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.stat-line:last-child{border:0}.stat-line strong{color:var(--navy)}.timeline{border-left:2px solid #dce8ef;margin:5px 0 0 7px;padding-left:17px;display:grid;gap:14px}.timeline-item{position:relative}.timeline-item:before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#2c8b82;left:-22px;top:5px}.timeline-item b{display:block;font-size:12px;color:var(--navy)}.timeline-item small{color:var(--muted);font-size:10px}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.three-col{grid-template-columns:1fr 1fr}}
@media(max-width:760px){aside{position:fixed;z-index:40;left:-260px;top:36px;bottom:0;transition:.2s}aside.open{left:0}.topbar{padding:0 15px;height:58px}.content{padding:20px 14px 38px}.page-head{flex-direction:column}.page-head h1{font-size:22px}.mobile-menu{display:inline-flex}.top-actions{gap:7px}.role-select{max-width:150px}.three-col{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.kpis{gap:9px}.card{padding:14px}.kpi-value{font-size:23px}.progress-row{grid-template-columns:90px 1fr 38px}}

<body>
<div class="demo-banner">DADOS DEMONSTRATIVOS — NÃO REPRESENTAM RESULTADOS REAIS</div>
<div class="app">
<aside id="sidebar">
 <div class="brand"><div class="brand-mark">F</div><strong>Gestão Estratégica<br>do Absenteísmo</strong><small>FGH · Protótipo demonstrativo</small></div>
 <div class="nav-label">Gestão</div>
 <nav class="nav" id="nav">
  <button class="active" data-page="inicio"><span class="ico">⌂</span>Visão geral</button>
  <button data-page="painel"><span class="ico">▥</span>Painel institucional</button>
  <button data-page="unidades"><span class="ico">▦</span>Hospitais e setores</button>

 <div class="side-bottom"><strong>Fundação Gestão Hospitalar</strong>Ambiente de demonstração<br>Versão conceitual · 2026</div>
</aside>
<main>
 <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn">☰</button><span class="crumb">FGH <span class="muted">/</span> <b id="crumb">Visão geral</b></span></div><div class="top-actions"><select class="role-select" id="roleSelect" aria-label="Perfil demonstrativo"><option value="admin">Perfil: Administrador FGH</option><option value="gestor">Perfil: Gestor hospitalar</option><option value="rh">Perfil: RH institucional</option><option value="setor">Perfil: Gestor setorial</option><option value="consulta">Perfil: Consulta institucional</option></select><div class="avatar">FG</div></div></header>
 <div class="content" id="content"></div>

<script>
(function(){
const TARGET=3.5;
const months=['Mai','Jun','Jul','Ago','Set','Out'];
const units=[
 {name:'Hospital Metropolitano Sul Dom Hélder Câmara',short:'HDH',rate:3.9,hours:4820,people:1280,trend:[3.8,3.6,3.7,3.5,3.8,3.9],sectors:[['UTI Adulto',4.2],['Enfermarias',3.6],['Emergência',4.1],['Centro Cirúrgico',3.1]]},
 {name:'Hospital Regional Norte',short:'HRN',rate:3.2,hours:3610,people:1050,trend:[3.7,3.5,3.4,3.3,3.3,3.2],sectors:[['UTI',3.5],['Enfermarias',3.0],['Emergência',3.4]]},
 {name:'Hospital Regional Centro',short:'HRC',rate:4.1,hours:5290,people:1420,trend:[4.4,4.2,4.0,4.2,4.0,4.1],sectors:[['UTI',4.4],['Enfermarias',3.8],['Emergência',4.3],['Apoio',4.0]]},
 {name:'Hospital Regional Litoral',short:'HRL',rate:2.9,hours:2780,people:890,trend:[3.4,3.3,3.2,3.0,3.0,2.9],sectors:[['UTI',3.1],['Enfermarias',2.8],['Emergência',2.9]]}
];
const initialPlans=[
 {id:1,title:'Analisar padrões de ausência nas equipes assistenciais',unit:'HDH',sector:'Enfermarias',owner:'Gestão de Pessoas + liderança',due:'2026-11-20',priority:'Alta',status:'Em andamento',progress:45,indicator:'Taxa de absenteísmo setorial',goal:'Identificar fatores organizacionais e pactuar medidas de apoio.',actions:'Análise de escala e distribuição de turnos; escuta estruturada das equipes; validação dos fatores identificados.',updated:'2026-10-30'},
 {id:2,title:'Revisar fluxo de acompanhamento de afastamentos',unit:'HRC',sector:'UTI',owner:'RH hospitalar',due:'2026-11-28',priority:'Média',status:'Não iniciado',progress:0,indicator:'Tempo de acompanhamento dos casos',goal:'Padronizar o acompanhamento institucional respeitando privacidade.',actions:'Mapear fluxo atual; pactuar responsabilidades; elaborar rotina de acompanhamento.',updated:'2026-10-29'},
 {id:3,title:'Avaliar organização das escalas e cobertura',unit:'HDH',sector:'Emergência',owner:'Coordenação assistencial',due:'2026-11-12',priority:'Alta',status:'Em andamento',progress:70,indicator:'Horas extras pagas e horas de ausência',goal:'Avaliar a relação entre ausências, cobertura e organização do trabalho.',actions:'Consolidar dados de escala; comparar cobertura prevista e realizada; propor ajustes.',updated:'2026-10-31'}
];
let plans=loadPlans(),page='inicio',currentUnit='Todos os hospitais',currentPeriod='Últimos 6 meses',role='admin';
function loadPlans(){try{const x=JSON.parse(localStorage.getItem('fgh_abs_plans')||'null');return Array.isArray(x)?x:initialPlans.slice()}catch(e){return initialPlans.slice()}}
function savePlans(){try{localStorage.setItem('fgh_abs_plans',JSON.stringify(plans))}catch(e){}}
function el(id){return document.getElementById(id)}
function fmt(n){return n.toLocaleString('pt-BR')}
function pct(n){return n.toFixed(1).replace('.',',')+'%'}
function toast(s){const t=el('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function statusClass(s){return s==='Concluído'?'':s==='Em andamento'?'warn':s==='Atrasado'?'bad':'gray'}
function selectedUnits(){return currentUnit==='Todos os hospitais'?units:units.filter(u=>u.short===currentUnit)}
function avgRate(list){return list.reduce((a,b)=>a+b.rate,0)/(list.length||1)}
function header(kicker,title,desc,button){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+(button||'')+'</div>'}
function filters(){return '<div class="filters"><div class="field"><label>Período de análise</label><select id="periodFilter"><option>Últimos 6 meses</option><option>Últimos 3 meses</option><option>Outubro/2026</option><option>2026</option></select></div><div class="field"><label>Hospital</label><select id="unitFilter"><option>Todos os hospitais</option>'+units.map(u=>'<option value="'+u.short+'">'+u.short+' · '+u.name+'</option>').join('')+'</select></div><div class="field"><label>Referência da meta</label><input value="Inferior a 3,5%" readonly></div><button class="btn" id="resetFilters">Limpar filtros</button></div>'}
function kpi(label,value,foot,icon,cls){return '<div class="card"><div class="kpi-top"><span>'+label+'</span><span class="kpi-icon">'+icon+'</span></div><div class="kpi-value">'+value+'</div><div class="kpi-foot '+(cls||'')+'">'+foot+'</div></div>'}
function chartRates(list){const max=5;return '<div class="chart">'+months.map((m,i)=>{const vals=list.map(u=>u.trend[i]);const av=vals.reduce((a,b)=>a+b,0)/vals.length;return '<div class="bar-group"><div class="bar" style="height:'+(av/max*100)+'%"><span>'+pct(av)+'</span></div></div>'}).join('')+'</div><div class="bar-labels">'+months.map(m=>'<span>'+m+'</span>').join('')+'</div><div class="legend"><span><i class="dot" style="background:#8eb9ce"></i>Taxa média demonstrativa</span><span><i class="dot" style="background:#2d8c83"></i>Meta: abaixo de 3,5%</span></div>'}
function unitBars(list){return '<div class="progress-list">'+list.map(u=>'<div class="progress-row"><span>'+u.short+'</span><div class="progress-track"><div class="progress-fill '+(u.rate>=4?'bad':u.rate>=TARGET?'warn':'')+'" style="width:'+Math.min(u.rate/5*100,100)+'%"></div></div><b>'+pct(u.rate)+'</b></div>').join('')+'</div>'}
function overview(){
 const list=selectedUnits(),rate=avgRate(list),hours=list.reduce((a,u)=>a+u.hours,0),above=list.filter(u=>u.rate>=TARGET).length,active=plans.filter(p=>p.status!=='Concluído').length;
 return header('GESTÃO ESTRATÉGICA · FGH','Visão geral','Acompanhe os indicadores, identifique contextos que merecem análise e conecte diagnósticos a planos de ação.','<button class="btn primary" data-go="planos">＋ Novo plano de ação</button>')+filters()+
 '<div class="notice"><b>Como interpretar:</b> a meta institucional é <b>inferior a 3,5%</b>. Resultados iguais ou superiores a 3,5% não atingem a meta. Os dados exibidos são fictícios e servem apenas para demonstrar a navegação.</div>'+
 '<div class="grid kpis">'+kpi('Taxa média de absenteísmo',pct(rate),'Referência demonstrativa do período','％',rate>=TARGET?'negative':'positive')+kpi('Horas de ausência',fmt(hours)+' h','Horas perdidas estimadas no período','◷')+kpi('Hospitais sem atingir a meta',above+' de '+list.length,'Taxa igual ou superior a 3,5%','⚑',above?'negative':'positive')+kpi('Planos de ação ativos',active,'Planos não concluídos','☷')+'</div>'+
 '<div class="grid two-col"><div class="card"><div class="card-title"><div><h3>Evolução da taxa de absenteísmo</h3><p>Comparação mensal · média simples dos hospitais selecionados</p></div><span class="pill">Mai–Out/2026</span></div>'+chartRates(list)+'</div><div class="card"><div class="card-title"><div><h3>Resultado por hospital</h3><p>Posicionamento em relação à meta</p></div></div>'+unitBars(list)+'<div class="notice warn" style="margin:17px 0 0">A leitura comparativa deve considerar porte, composição das equipes, perfil assistencial e contexto local.</div></div></div>'+
 '<div class="grid two-col"><div class="card"><div class="card-title"><div><h3>Hospitais que requerem atenção</h3><p>Unidades com taxa igual ou superior a 3,5%</p></div><button class="btn" data-go="unidades">Ver unidades</button></div>'+tableUnits(list.filter(u=>u.rate>=TARGET))+'</div><div class="card"><div class="card-title"><div><h3>Planos em acompanhamento</h3><p>Atividades registradas na demonstração</p></div><button class="btn" data-go="monitoramento">Acompanhar</button></div>'+plans.slice(0,3).map(p=>'<div class="stat-line"><span>'+p.title+'</span><strong>'+p.progress+'%</strong></div>').join('')+'</div></div>'+footnote()
}
function tableUnits(list){if(!list.length)return '<div class="empty">Nenhuma unidade nesta condição para o filtro selecionado.</div>';return '<div class="table-wrap"><table><thead><tr><th>Hospital</th><th>Taxa</th><th>Horas</th><th>Situação</th></tr></thead><tbody>'+list.map(u=>'<tr><td><strong>'+u.name+'</strong></td><td>'+pct(u.rate)+'</td><td>'+fmt(u.hours)+' h</td><td><span class="status '+(u.rate>=TARGET?'bad':'')+'">'+(u.rate>=TARGET?'Não atingiu a meta':'Meta atingida')+'</span></td></tr>').join('')+'</tbody></table></div>'}
function panel(){const list=selectedUnits();return header('INDICADORES','Painel institucional','Explore os resultados demonstrativos por período e hospital. Os indicadores oficiais deverão ser alimentados pela fonte institucional validada.')+filters()+
 '<div class="grid kpis">'+kpi('Taxa média',pct(avgRate(list)),'Média simples dos hospitais selecionados','％')+kpi('Horas perdidas',fmt(list.reduce((a,u)=>a+u.hours,0))+' h','Estimativa de horas não trabalhadas','◷')+kpi('Hospitais analisados',list.length,'No recorte atual','▦')+kpi('Hospitais ≥ 3,5%',list.filter(u=>u.rate>=TARGET).length,'Não atingiram a meta','⚑','negative')+'</div>'+
 '<div class="grid two-col"><div class="card"><div class="card-title"><div><h3>Série histórica da taxa</h3><p>Visualização demonstrativa de maio a outubro de 2026</p></div></div>'+chartRates(list)+'</div><div class="card"><div class="card-title"><div><h3>Distribuição por hospital</h3><p>Taxa atual demonstrativa</p></div></div>'+unitBars(list)+'</div></div>'+
 '<div class="card section"><div class="card-title"><div><h3>Detalhamento institucional</h3><p>Os números não representam dados reais da FGH.</p></div><button class="btn" id="exportUnits">Exportar CSV</button></div>'+tableUnits(list)+'</div>'+footnote()}
function unitsPage(){return header('ESTRUTURA ORGANIZACIONAL','Hospitais e setores','Consulte a estrutura de referência usada para organizar a análise. A composição real deverá ser validada com cada unidade.')+
 '<div class="notice">A lista abaixo é ilustrativa. Antes da implantação, a FGH deverá validar nomes oficiais, setores, vínculos e regras de consolidação.</div><div class="grid two-col">'+units.map(u=>'<div class="card"><div class="card-title"><div><h3>'+u.name+'</h3><p>Código demonstrativo: '+u.short+'</p></div><span class="status '+(u.rate>=TARGET?'bad':'')+'">'+pct(u.rate)+'</span></div><div class="section"><b style="font-size:11px">Setores de referência</b><div class="action-meta">'+u.sectors.map(s=>'<span class="tag">'+s[0]+' · '+pct(s[1])+'</span>').join('')+'</div></div><div class="stat-line"><span>Horas de ausência (demo)</span><strong>'+fmt(u.hours)+' h</strong></div><div class="stat-line"><span>Meta institucional</span><strong>Inferior a 3,5%</strong></div></div>').join('')+'</div>'+footnote()}
function diagnosis(){return header('ANÁLISE CONTEXTUAL','Diagnóstico','Organize a leitura dos indicadores sem confundir associação, hipótese e causa confirmada.')+
 '<div class="notice warn"><b>Importante:</b> os apontamentos são exemplos didáticos. O sistema não identifica causas automaticamente nem substitui a análise técnica, a escuta das equipes ou a validação dos dados.</div><div class="grid two-col"><div class="card"><div class="card-title"><div><h3>Exemplo de leitura — HDH</h3><p>Recorte fictício · outubro de 2026</p></div><span class="status bad">4,1% · exemplo setorial</span></div><div class="section"><div class="eyebrow">Fato observado</div><p>O indicador demonstrativo do setor está acima da meta institucional de inferior a 3,5%.</p></div><div class="section"><div class="eyebrow">Hipóteses a investigar</div><ul><li>Distribuição de turnos e jornadas;</li><li>Concentração temporal de afastamentos;</li><li>Condições e organização do trabalho;</li><li>Disponibilidade e previsibilidade de cobertura.</li></ul></div><div class="section"><div class="eyebrow">Informações ainda necessárias</div><ul><li>Série histórica validada e denominadores;</li><li>Distribuição por tipo e duração de ausência, em dados agregados;</li><li>Escalas previstas e cobertura realizada;</li><li>Escuta qualificada das equipes e lideranças.</li></ul></div></div><div class="card"><div class="card-title"><div><h3>Quadro de qualidade da análise</h3><p>O que precisa ser separado no diagnóstico</p></div></div><div class="stat-line"><span>Fatos observados</span><span class="status">Mensurados</span></div><div class="stat-line"><span>Hipóteses explicativas</span><span class="status warn">A investigar</span></div><div class="stat-line"><span>Fatores confirmados</span><span class="status gray">Exige evidência</span></div><div class="stat-line"><span>Lacunas de informação</span><span class="status bad">Preencher</span></div><div class="notice green" style="margin-top:15px">A análise deve ser organizacional, contextual e não punitiva. Evite atribuir responsabilidade individual sem evidência e sem devido processo.</div></div></div><div class="card section"><div class="card-title"><div><h3>Roteiro para reunião de diagnóstico</h3><p>Sequência sugerida para discussão com a unidade</p></div></div><div class="timeline"><div class="timeline-item"><b>1. Validar o indicador</b><small>Fonte, período, população, denominador e consistência dos dados.</small></div><div class="timeline-item"><b>2. Descrever o padrão</b><small>Onde, quando e em que dimensão o resultado se concentra.</small></div><div class="timeline-item"><b>3. Investigar o contexto</b><small>Escalas, condições de trabalho, processos, cobertura e escuta das equipes.</small></div><div class="timeline-item"><b>4. Pactuar prioridades</b><small>Selecionar fatores passíveis de intervenção e definir responsáveis institucionais.</small></div><div class="timeline-item"><b>5. Registrar plano e monitorar</b><small>Metas, prazos, evidências e avaliação de resultados.</small></div></div></div>'+footnote()}
function plansPage(){return header('INTERVENÇÃO','Planos de ação','Registre iniciativas pactuadas, responsáveis por função, prazos e indicadores de acompanhamento.','<button class="btn primary" id="newPlan">＋ Criar plano</button>')+
 '<div class="notice">Os planos criados nesta demonstração ficam salvos somente neste navegador, por meio do armazenamento local. Não são enviados a um banco institucional.</div><div class="filters"><div class="field"><label>Status</label><select id="planStatus"><option>Todos</option><option>Não iniciado</option><option>Em andamento</option><option>Concluído</option></select></div><div class="field"><label>Hospital</label><select id="planUnit"><option>Todos</option>'+units.map(u=>'<option>'+u.short+'</option>').join('')+'</select></div></div><div class="cards-list" id="plansList">'+renderPlanCards(plans)+'</div>'+footnote()}
function renderPlanCards(list){if(!list.length)return '<div class="card empty">Nenhum plano corresponde aos filtros.</div>';return list.map(p=>'<div class="action-card"><div class="action-head"><div><h3>'+p.title+'</h3><p>'+p.unit+' · '+p.sector+' · Responsável: '+p.owner+'</p></div><span class="status '+statusClass(p.status)+'">'+p.status+'</span></div><div class="progress-track" style="margin:13px 0 5px"><div class="progress-fill" style="width:'+p.progress+'%"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:#718096"><span>Progresso registrado</span><b>'+p.progress+'%</b></div><div class="action-meta"><span class="tag">Prioridade: '+p.priority+'</span><span class="tag">Prazo: '+dateBR(p.due)+'</span><span class="tag">Atualizado: '+dateBR(p.updated)+'</span></div><p><b>Objetivo:</b> '+p.goal+'</p><p><b>Indicador:</b> '+p.indicator+'</p><div style="display:flex;gap:7px;margin-top:10px"><button class="btn" data-edit="'+p.id+'">Editar / atualizar</button><button class="btn danger" data-delete="'+p.id+'">Excluir</button></div></div>').join('')}
function dateBR(s){if(!s)return '—';const a=s.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:s}
function monitoring(){const active=plans.filter(p=>p.status!=='Concluído'),avg=active.length?active.reduce((a,p)=>a+p.progress,0)/active.length:0;return header('EXECUÇÃO E RESULTADOS','Monitoramento','Acompanhe prazos, andamento, evidências e resultados dos planos pactuados.')+
 '<div class="grid kpis">'+kpi('Planos cadastrados',plans.length,'Registros nesta demonstração','☷')+kpi('Em acompanhamento',active.length,'Não concluídos','◷')+kpi('Progresso médio',Math.round(avg)+'%','Média simples dos planos ativos','↗')+kpi('Concluídos',plans.filter(p=>p.status==='Concluído').length,'Com status concluído','✓')+'</div><div class="card"><div class="card-title"><div><h3>Quadro de acompanhamento</h3><p>Atualize o progresso e registre evidências na edição do plano.</p></div><button class="btn" data-go="planos">Gerenciar planos</button></div>'+ (plans.length?'<div class="table-wrap"><table><thead><tr><th>Plano</th><th>Unidade</th><th>Prazo</th><th>Status</th><th>Progresso</th><th></th></tr></thead><tbody>'+plans.map(p=>'<tr><td><strong>'+p.title+'</strong><br><span class="muted">'+p.owner+'</span></td><td>'+p.unit+' / '+p.sector+'</td><td>'+dateBR(p.due)+'</td><td><span class="status '+statusClass(p.status)+'">'+p.status+'</span></td><td>'+p.progress+'%</td><td><button class="btn" data-edit="'+p.id+'">Abrir</button></td></tr>').join('')+'</tbody></table></div>':'<div class="empty">Nenhum plano cadastrado.</div>')+'</div><div class="grid two-col section"><div class="card"><h3 style="margin:0 0 12px;font-size:14px;color:var(--navy)">Ciclo de monitoramento</h3><div class="timeline"><div class="timeline-item"><b>Planejar</b><small>Definir problema, objetivo, ações, responsável e prazo.</small></div><div class="timeline-item"><b>Executar</b><small>Registrar andamento e obstáculos.</small></div><div class="timeline-item"><b>Verificar</b><small>Conferir evidências, indicador e resultado.</small></div><div class="timeline-item"><b>Agir e aprender</b><small>Revisar a estratégia e compartilhar aprendizados.</small></div></div></div><div class="card"><h3 style="margin:0 0 12px;font-size:14px;color:var(--navy)">Cuidados na avaliação</h3><ul><li>Comparar períodos equivalentes.</li><li>Considerar sazonalidade e mudanças na força de trabalho.</li><li>Não atribuir causalidade apenas por variação do indicador.</li><li>Registrar fatores externos e mudanças de contexto.</li><li>Separar custo estimado de horas perdidas de despesas efetivamente pagas.</li></ul></div></div>'+footnote()}
function users(){const rows=[['Administrador institucional FGH','Configuração global, estrutura, perfis e acesso institucional.'],['Administrador operacional','Administração dos registros e parâmetros operacionais autorizados.'],['Gestor institucional','Visão consolidada, diagnóstico e acompanhamento entre hospitais.'],['RH institucional','Análise agregada, apoio metodológico e acompanhamento de planos.'],['Gestor hospitalar','Visão e gestão do hospital sob sua responsabilidade.'],['Gestor setorial','Acesso restrito ao setor autorizado e aos respectivos planos.'],['Consulta institucional','Visualização de painéis e informações autorizadas, sem edição.']];return header('GOVERNANÇA','Usuários e permissões','Matriz conceitual de acesso. A seleção de perfil no topo apenas demonstra como a experiência pode variar; não é autenticação real.')+
 '<div class="notice warn"><b>Protótipo sem controle de acesso real.</b> Não cadastre nomes, e-mails, matrículas, senhas ou dados de trabalhadores. A implantação exigirá autenticação institucional, gestão de identidade, trilhas de auditoria e revisão de permissões.</div><div class="card"><div class="card-title"><div><h3>Perfis previstos</h3><p>Princípio: acesso mínimo necessário, por função e unidade de responsabilidade.</p></div></div><div class="table-wrap"><table><thead><tr><th>Perfil</th><th>Escopo conceitual</th><th>Permissão predominante</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td><strong>'+r[0]+'</strong></td><td>'+r[1]+'</td><td><span class="status '+(i===0?'':'gray')+'">'+(i===0?'Administração total':i===6?'Somente leitura':'Gestão autorizada')+'</span></td></tr>').join('')+'</tbody></table></div></div><div class="grid two-col section"><div class="card"><h3 style="font-size:14px;color:var(--navy);margin-top:0">Princípios de governança</h3><ul><li>Identidade institucional e autenticação segura.</li><li>Permissões vinculadas à função e ao escopo de atuação.</li><li>Registro de alterações e acessos relevantes.</li><li>Revisão periódica de usuários ativos.</li><li>Desativação tempestiva de acessos não necessários.</li></ul></div><div class="card"><h3 style="font-size:14px;color:var(--navy);margin-top:0">Privacidade e proteção</h3><ul><li>Indicadores preferencialmente agregados.</li><li>Minimização de dados pessoais.</li><li>Finalidade e base legal definidas pela instituição.</li><li>Perfis de acesso e retenção formalizados.</li><li>Avaliação de riscos e governança LGPD.</li></ul></div></div>'+footnote()}
function about(){return header('INFORMAÇÕES','Sobre o projeto','Proposta de ferramenta institucional para apoiar a gestão estratégica do absenteísmo na FGH.')+
 '<div class="grid two-col"><div class="card"><div class="eyebrow">Propósito</div><h2 style="font-size:20px;color:var(--navy);margin:6px 0 12px">Do indicador à melhoria organizacional</h2><p>Organizar informações, apoiar a compreensão dos contextos, estruturar planos de ação e acompanhar sua execução e seus resultados — com abordagem institucional, colaborativa e não punitiva.</p><div class="notice green">Meta institucional de referência: taxa de absenteísmo <b>inferior a 3,5%</b>.</div></div><div class="card"><h3 style="font-size:14px;color:var(--navy);margin-top:0">Ciclo de gestão</h3><div class="timeline"><div class="timeline-item"><b>1. Medir</b><small>Receber e validar indicadores da fonte oficial.</small></div><div class="timeline-item"><b>2. Compreender</b><small>Descrever padrões e investigar fatores contextuais.</small></div><div class="timeline-item"><b>3. Planejar</b><small>Definir intervenções, responsáveis e prazos.</small></div><div class="timeline-item"><b>4. Acompanhar</b><small>Monitorar execução, obstáculos e evidências.</small></div><div class="timeline-item"><b>5. Avaliar e aprender</b><small>Verificar resultados e disseminar aprendizados.</small></div></div></div></div><div class="card section"><h3 style="font-size:14px;color:var(--navy);margin-top:0">Escopo desta demonstração</h3><div class="grid three-col"><div><b>Incluído</b><ul><li>Navegação entre módulos</li><li>Indicadores sintéticos</li><li>Filtros demonstrativos</li><li>Cadastro local de planos</li><li>Atualização de status e progresso</li></ul></div><div><b>Não incluído</b><ul><li>Dados oficiais do BI/RH</li><li>Integração automática</li><li>Autenticação institucional</li><li>Banco de dados compartilhado</li><li>IA ou diagnóstico automatizado</li></ul></div><div><b>Próximas validações</b><ul><li>Regras e fórmulas dos indicadores</li><li>Fonte, periodicidade e qualidade dos dados</li><li>Governança e perfis</li><li>Fluxo de planos e aprovação</li><li>Segurança e LGPD</li></ul></div></div></div><div class="card section"><h3 style="font-size:14px;color:var(--navy);margin-top:0">Regras importantes de leitura</h3><ul><li><b>Taxa:</b> a regra institucional é inferior a 3,5%; resultado igual a 3,5% não atinge a meta.</li><li><b>Horas perdidas:</b> representam estimativa de tempo não trabalhado; não equivalem automaticamente a desembolso financeiro.</li><li><b>Hora extra:</b> despesas efetivamente pagas devem ser apresentadas separadamente e com fonte comprovável.</li><li><b>Cobertura:</b> custos de cobertura só devem ser contabilizados quando houver dado validado, evitando dupla contagem.</li><li><b>Diagnóstico:</b> associação não comprova causalidade. Hipóteses precisam de investigação e validação.</li></ul></div>'+footnote()}
function footnote(){return '<div class="footer-note">Protótipo demonstrativo · Dados inteiramente sintéticos · Não utilizar para decisões reais de gestão ou avaliação individual.</div>'}
function render(){const titles={inicio:'Visão geral',painel:'Painel institucional',unidades:'Hospitais e setores',diagnostico:'Diagnóstico',planos:'Planos de ação',monitoramento:'Monitoramento',usuarios:'Usuários e permissões',sobre:'Sobre o projeto'};el('crumb').textContent=titles[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const views={inicio:overview,painel:panel,unidades:unitsPage,diagnostico:diagnosis,planos:plansPage,monitoramento:monitoring,usuarios:users,sobre:about};el('content').innerHTML=views[page]();bindPage()}
function bindPage(){
 const pf=el('periodFilter'),uf=el('unitFilter');if(pf){pf.value=currentPeriod;pf.addEventListener('change',()=>{currentPeriod=pf.value;render()})}if(uf){uf.value=currentUnit;uf.addEventListener('change',()=>{currentUnit=uf.value;render()})}const reset=el('resetFilters');if(reset)reset.addEventListener('click',()=>{currentPeriod='Últimos 6 meses';currentUnit='Todos os hospitais';render()});
 document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
 const np=el('newPlan');if(np)np.addEventListener('click',()=>openPlan());
 const ps=el('planStatus'),pu=el('planUnit');function filterPlans(){const l=plans.filter(p=>(!ps||ps.value==='Todos'||p.status===ps.value)&&(!pu||pu.value==='Todos'||p.unit===pu.value));el('plansList').innerHTML=renderPlanCards(l);bindPlanButtons()}if(ps)ps.addEventListener('change',filterPlans);if(pu)pu.addEventListener('change',filterPlans);bindPlanButtons();
 const ex=el('exportUnits');if(ex)ex.addEventListener('click',exportUnits);
}
function bindPlanButtons(){document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openPlan(Number(b.dataset.edit))));document.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',()=>{if(confirm('Excluir este plano demonstrativo?')){plans=plans.filter(p=>p.id!==Number(b.dataset.delete));savePlans();render();toast('Plano excluído nesta demonstração.')}}))}
function openPlan(id){const p=plans.find(x=>x.id===id)||{id:null,title:'',unit:'HDH',sector:'Enfermarias',owner:'',due:'2026-11-30',priority:'Média',status:'Não iniciado',progress:0,indicator:'',goal:'',actions:'',updated:'2026-11-01'};el('modal').innerHTML='<h2>'+(id?'Atualizar plano de ação':'Novo plano de ação')+'</h2><form id="planForm"><div class="form-grid"><div class="field full"><label>Título do plano</label><input name="title" required maxlength="120" value="'+esc(p.title)+'"></div><div class="field"><label>Hospital</label><select name="unit">'+units.map(u=>'<option '+(u.short===p.unit?'selected':'')+'>'+u.short+'</option>').join('')+'</select></div><div class="field"><label>Setor</label><input name="sector" required value="'+esc(p.sector)+'"></div><div class="field"><label>Responsável (função/equipe)</label><input name="owner" required value="'+esc(p.owner)+'"></div><div class="field"><label>Prazo</label><input name="due" type="date" required value="'+p.due+'"></div><div class="field"><label>Prioridade</label><select name="priority">'+['Baixa','Média','Alta'].map(x=>'<option '+(x===p.priority?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Status</label><select name="status">'+['Não iniciado','Em andamento','Concluído'].map(x=>'<option '+(x===p.status?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Progresso (%)</label><input name="progress" type="number" min="0" max="100" value="'+p.progress+'"></div><div class="field full"><label>Objetivo</label><textarea name="goal">'+esc(p.goal)+'</textarea></div><div class="field full"><label>Ações previstas / evidências</label><textarea name="actions">'+esc(p.actions)+'</textarea></div><div class="field full"><label>Indicador de acompanhamento</label><input name="indicator" value="'+esc(p.indicator)+'"></div></div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancelar</button><button class="btn primary" type="submit">Salvar plano</button></div></form>';el('modalBackdrop').classList.add('show');el('cancelModal').onclick=closeModal;el('planForm').onsubmit=function(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());d.progress=Math.max(0,Math.min(100,Number(d.progress)||0));if(d.status==='Concluído')d.progress=100;d.updated='2026-11-01';if(p.id){plans=plans.map(x=>x.id===p.id?Object.assign({},x,d):x)}else{d.id=Date.now();plans.unshift(d)}savePlans();closeModal();render();toast('Plano salvo apenas neste navegador.');};}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function closeModal(){el('modalBackdrop').classList.remove('show')}
function go(p){page=p;render();el('sidebar').classList.remove('open');window.scrollTo(0,0)}
function exportUnits(){const rows=[['Hospital','Taxa demonstrativa','Horas demonstrativas','Meta'],...selectedUnits().map(u=>[u.name,pct(u.rate),u.hours,'Inferior a 3,5%'])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');download(csv,'indicadores-demonstrativos-fgh.csv','text/csv;charset=utf-8;')}
function download(data,name,type){const blob=new Blob(['\ufeff'+data],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
el('roleSelect').addEventListener('change',e=>{role=e.target.value;const names={admin:'Administrador institucional FGH',gestor:'Gestor hospitalar',rh:'RH institucional',setor:'Gestor setorial',consulta:'Consulta institucional'};toast('Perfil demonstrativo selecionado: '+names[role]+'. Não altera permissões reais.');});
el('menuBtn').addEventListener('click',()=>el('sidebar').classList.toggle('open'));
el('modalBackdrop').addEventListener('click',e=>{if(e.target===el('modalBackdrop'))closeModal()});
render();
})();
</script>
</body>
</html>
